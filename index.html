ke the quiz",b:["First Step","Goal Setter","3-Day Streak","Bag Refuser"]},

let lang="en",view="land",step=0,ans={buys:[]},consent=false,refuse=2,res=null,tab=0,shareImg="";
let P={pts:0,streak:0,last:"",badges:[],goal:-1,avoided:0};

const t=k=>S[lang][k],fm=n=>Math.round(n).toLocaleString(),$=id=>document.getElementById(id);

 if(view=="land")h=`<h1>${T.hook}</h1><p class="mut">${T.sub}</p><div class="card"><div class="big">🛍️</div><p><b>${T.live(pe,bg)}</b></p></div><button class="btn" onclick="go('quiz')">${T.start}</button>`;
 else if(view=="quiz"){const q=Q[step],last=step==Q.length-1;
  h=`<div class="bar" role="progressbar" aria-valuenow="${step+1}" aria-valuemax="${Q.length}"><i style="width:${(step+1)/Q.length*100}%"></i></div><p class="mut">${step+1} / ${Q.length}</p><h2>${q.t[lang]}</h2>`;
  if(q.sel)h+=`<select aria-label="${q.t[lang]}" onchange="ans.${q.id}=this.value"><option value="">—</option>${q.o.map(o=>`<option value="${o[0]}"${ans[q.id]==o[0]?" selected":""}>${o[1][lang]}</option>`).join("")}</select>`;
  else h+=q.o.map(o=>{const on=q.multi?ans.buys.includes(o[0]):ans[q.id]==o[0];return`<button class="opt${on?" on":""}" aria-pressed="${on}" onclick="${q.multi?`mult('${o[0]}')`:`pick('${q.id}',${typeof o[0]=="string"?`'${o[0]}'`:o[0]})`}">${o[1][lang]}</button>`}).join("");
  if(last)h+=`<label class="card" style="display:block"><input type="checkbox" ${consent?"checked":""} onchange="consent=this.checked"> ${T.consent}</label><details><summary>${T.priv}</summary><p class="mut">${T.privT}</p></details>`;
  h+=`<button class="btn alt" onclick="nxt(1)">${last?T.show:T.next}</button>${step?`<button class="pill" style="margin:12px 0" onclick="nxt(-1)">← ${T.back}</button>`:""}`}
 else if(view=="res"){const r=res,pr=T.persona[r.p];
  h=`<div class="tabs" role="tablist">${T.tabs.map((x,i)=>`<button class="${tab==i?"on":""}" onclick="setTab(${i})">${x}</button>`).join("")}</div>`;
  if(tab==0)h+=`<div class="card"><p class="mut">${T.yr}</p><div class="big"><span id="c1">0</span> kg</div><p><b>${fm(r.bags)}</b> ${T.bagsYr}</p></div><div class="card"><h2>${pr[0]}</h2><p>${pr[1]}</p></div><div class="card"><p class="mut">${T.ifall}</p><div class="big"><span id="c2">0</span></div><p>${T.tonnes}</p></div>
   <details class="card"><summary>${T.how}</summary><p class="mut">Bags/yr = visits/wk × 52 × share taking a bag × (1 − own-bag cut) = ${r.v} × 52 × ${C.bagShare[ans.bag||"sometimes"]} × ${1-C.ownBagCut[ans.own||"never"]} = ${fm(r.bags)}<br>Weight = bags × ${C.bagG} g + cutlery items × ${C.cutleryG} g + containers × ${C.containerG} g<br>Scale-up = grams × ${fm(C.population)} people ÷ 1,000,000 = tonnes<br><i>Bag weight, population and range midpoints are placeholders pending sources.</i></p></details><button class="btn" onclick="setTab(1)">${T.tabs[1]} →</button>`;
  if(tab==1){const mx=Math.max(2,Math.ceil(r.bags/52));if(refuse>mx)refuse=mx;h+=`<div class="card"><h2>${T.sim}</h2><label for="sl">${T.slider}: <b id="rv">${refuse}</b></label><input id="sl" type="range" min="0" max="${mx}" value="${refuse}" oninput="simr(this.value)"><p class="mut">${T.newp}</p><div class="big" id="np"></div><p class="mut">${T.saved}</p><div class="big" id="ns"></div></div><button class="btn" onclick="setTab(2)">${T.tabs[2]} →</button>`}
  if(tab==2){h+=`<div class="card"><h2>${T.goalT}</h2>${T.goals.map((g,i)=>`<button class="opt${P.goal==i?" on":""}" onclick="setGoal(${i})">${g}</button>`).join("")}<p><b>${T.pts}: ${P.pts}</b> · ${T.streak}: 🔥${P.streak}</p><button class="btn alt" ${P.last==day()?"disabled":""} onclick="checkin()">${P.last==day()?T.done:T.checkin}</button><div style="margin-top:10px">${P.badges.map(i=>`<span class="badge">🏅 ${T.b[i]}</span>`).join("")}</div></div>
   <div class="card"><p><b>${T.comm} ${bg}</b></p><div class="bar"><i style="width:${Math.min(100,(C.communityBags+P.avoided)/1500)}%"></i></div></div>
   <div class="card"><b>${T.lb}</b>${bars([["Chula",420],["Thammasat",388],["Your office",P.pts+250]],Math.max(500,P.pts+250))}</div>
   <button class="btn" onclick="shareCard()">${T.share}</button>${shareImg?`<img src="${shareImg}" alt="Share card" style="width:100%;border-radius:16px;margin-top:12px"><p class="mut">${T.shareH}</p>`:""}`}
 }else if(view=="dash"){const s=C.sample;
  h=`<h1>${T.dT}</h1><p class="mut">${T.note} n=${fm(s.n)}</p><div class="card"><h2>${T.avgR}</h2>${bars(s.regions,250)}</div><div class="card"><h2>${T.ownA}</h2>${bars(s.ownBagByAge,100,"%")}</div><div class="card"><h2>${T.drv}</h2>${bars(s.drivers,100,"%")}</div>
  <div class="card"><h2>${T.asks}</h2><ol><li>Point-of-sale bag charge or opt-in bags <span class="mut">(regional averages)</span></li><li>Youth reusable-bag incentives <span class="mut">(own-bag share by age)</span></li><li>Hot-food packaging standards <span class="mut">(purchase-type driver)</span></li></ol></div><button class="btn alt" onclick="brief()">${T.brief}</button><pre id="bp" hidden></pre>`}
 a.innerHTML=h+`<p class="mut" style="margin-top:24px">🔒 ${T.priv}: ${T.privT.slice(0,90)}…</p>`;
 if(view=="res"&&tab==0){count("c1",res.g/1000,1);count("c2",res.tonnes)}if(view=="res"&&tab==1)simr(refuse)}
draw();
</script></body></html>
